name: Release

# Push a tag `vX.Y.Z` to build the signed .deb and .AppImage and publish them on the
# Releases page. The tag must match the app version and have a CHANGELOG.md section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # build provenance
  attestations: write

jobs:
  linux:
    # 22.04 (glibc 2.35) keeps the packages usable on Ubuntu 22.04+, Debian 12+ and derivatives.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag, the version and the changelog
        run: |
          version="${TAG#v}"
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [ "$version" = "$app_version" ] || { echo "::error::Tag $TAG does not match app version $app_version"; exit 1; }
          # Everything under "## [X.Y.Z]" up to the next "## [" heading becomes the release notes.
          awk -v v="$version" '
            /^## \[/ { on = (index($0, "## [" v "]") == 1); next }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          cat notes.md

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::Add the GPG_PRIVATE_KEY and GPG_PASSPHRASE repository secrets; releases must be signed."; exit 1; }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')" >> "$GITHUB_ENV"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build (AppImage signed in place)
        env:
          SIGN: "1"
          SIGN_KEY: ${{ env.GPG_KEY_ID }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          APPIMAGETOOL_FORCE_SIGN: "1"
        run: npx tauri build --bundles deb,appimage

      - name: Sign and checksum
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir dist
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage dist/
          cd dist
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$GPG_KEY_ID" --armor --detach-sign "$1"; }
          for file in *.deb *.AppImage; do sign "$file"; done
          sha256sum *.deb *.AppImage > SHA256SUMS
          sign SHA256SUMS
          ls -l

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.AppImage

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "MarkdownEditor $TAG" --notes-file notes.md --verify-tag
