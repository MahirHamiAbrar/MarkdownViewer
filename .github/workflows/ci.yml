name: CI

# Pushes to main are tested by the Release workflow, which calls this one per platform.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      os:
        description: Runner to test on; all three when empty.
        type: string
        default: ""

concurrency:
  # A call from Release is keyed by its run, so the three platform calls never cancel each other.
  group: ci-${{ inputs.os && github.run_id || github.ref }}-${{ inputs.os }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 (glibc 2.35) matches the release build.
        os: ${{ fromJSON(inputs.os && format('["{0}"]', inputs.os) || '["ubuntu-22.04", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Frontend checks
        if: runner.os == 'Linux'
        run: |
          node --check src/main.js
          node src/mdsource.js
          node src/markctx.js
          node src/pdfctx.js
          bash -n install.sh
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
