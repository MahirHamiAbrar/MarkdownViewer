name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint frontend and scripts
        run: |
          node --check src/main.js
          bash -n install.sh
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Tag a commit `vX.Y.Z` to build the .deb and .AppImage and publish them on the release page.
  # Builds inside an ubuntu:22.04 container (glibc 2.35) so both packages run on Ubuntu 22.04+,
  # Debian 12+, and derivatives — while the ubuntu-latest host sidesteps the ubuntu-22.04
  # runner-image deprecation (brownouts since Sept 2026).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    permissions:
      contents: write
    steps:
      - name: System libraries
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config curl wget file git ca-certificates \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Markdown ${{ github.ref_name }}
          releaseDraft: false
          args: --bundles deb,appimage
