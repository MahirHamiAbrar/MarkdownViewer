name: Platform release

# One platform of the Release workflow: CI's tests, then the build once they pass.
on:
  workflow_call:
    inputs:
      os: { type: string, required: true }
      args: { type: string, required: true } # tauri build arguments
      out: { type: string, required: true } # bundle folder
      version: { type: string, required: true }

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      os: ${{ inputs.os }}

  build:
    needs: test
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Import the signing key
        if: runner.os == 'Linux'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::Add the GPG_PRIVATE_KEY and GPG_PASSPHRASE repository secrets; releases must be signed."; exit 1; }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')" >> "$GITHUB_ENV"

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Set the release version
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), p = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(p, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
          ' "${{ inputs.version }}"
      # SIGN* only matter to the AppImage bundler (signed in place); other platforms ignore them.
      - name: Build
        shell: bash
        env:
          SIGN: ${{ runner.os == 'Linux' && '1' || '' }}
          SIGN_KEY: ${{ env.GPG_KEY_ID }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          APPIMAGETOOL_FORCE_SIGN: ${{ runner.os == 'Linux' && '1' || '' }}
        run: npx tauri build ${{ inputs.args }}

      - name: Collect
        shell: bash
        run: |
          mkdir dist
          find "${{ inputs.out }}" -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} dist/ \;
          ls -l dist
          [ -n "$(ls dist)" ] || { echo "::error::No packages found under ${{ inputs.out }}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

