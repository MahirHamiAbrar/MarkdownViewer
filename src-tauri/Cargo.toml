[package]
name = "mdviewer"
version = "0.1.0"
description = "A calm Markdown viewer and editor"
edition = "2021"

[lib]
name = "mdviewer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
comrak = { version = "0.55", features = ["syntect"] }
ammonia = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
two-face = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
futures-util = "0.3"
scraper = "0.29"
base64 = "0.23"
urlencoding = "2"
tokio = { version = "1", features = ["time", "macros"] }

# Smaller binary = less to map and relocate at launch.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
