stages:
  - test
  - package
  - release

default:
  image: ubuntu:22.04
  interruptible: true

variables:
  # Keep the Rust and npm caches inside the project so GitLab can cache them.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

# Ubuntu 22.04 (glibc 2.35) keeps the .deb and .AppImage usable on Ubuntu 22.04+,
# Debian 12+, and their derivatives.
.tauri-linux:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        build-essential pkg-config curl wget file git ca-certificates
        libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - . "$CARGO_HOME/env"
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
        - package-lock.json
    paths:
      - .cargo/registry
      - .cargo/git
      - .npm

test:
  extends: .tauri-linux
  stage: test
  # Only run when files that affect the build or its checks change. Tags always
  # run, since a release must be built from whatever the tag points at.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*
        - src-tauri/**/*
        - install.sh
        - package.json
        - package-lock.json
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*
        - src-tauri/**/*
        - install.sh
        - package.json
        - package-lock.json
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG
  script:
    - npm ci
    - node --check src/main.js
    - bash -n install.sh
    - cargo test --manifest-path src-tauri/Cargo.toml

# Tag a commit `vX.Y.Z` to build the .deb and .AppImage and publish them on the
# Releases page.
build:linux:
  extends: .tauri-linux
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - test
  script:
    - npm ci
    - npx tauri build --bundles deb,appimage
  artifacts:
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 1 week

# release-cli is deprecated (removal in GitLab 20.0), so create the release with
# glab. Assets go to the generic package registry, whose API accepts the job token
# and whose version format allows the `vX.Y.Z` tag as-is.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  interruptible: false
  needs:
    - build:linux
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - >
      glab release create "$CI_COMMIT_TAG"
      --repo "$CI_PROJECT_PATH"
      --name "Markdown $CI_COMMIT_TAG"
      --notes "Linux packages for $CI_COMMIT_TAG."
      --use-package-registry
      --package-name markdown
      src-tauri/target/release/bundle/deb/*.deb
      src-tauri/target/release/bundle/appimage/*.AppImage
